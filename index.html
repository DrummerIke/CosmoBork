<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CosmoBork — предпросмотр</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
    body{--ink:#e2e5e9;--muted:#9098a5;--line:#ffffff18;background:#11151c;color:var(--ink);transition:background .4s}
    body[data-bg="warm"]{background:#292520}
    body[data-bg="light"]{background:#eae9e5;--ink:#242930;--muted:#60656c;--line:#00000020}
    body[data-bg="gradient"]{background:radial-gradient(ellipse at 15% 10%,#273746 0,transparent 62%),linear-gradient(130deg,#12191c,#251f2b)}
    body[data-bg="grid"]{background-color:#3b414b;background-image:linear-gradient(45deg,#ffffff0b 25%,transparent 25%),linear-gradient(-45deg,#ffffff0b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff0b 75%),linear-gradient(-45deg,transparent 75%,#ffffff0b 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    iframe{position:fixed;inset:0;border:0;width:100%;height:100%;background:transparent;pointer-events:none}
    header{position:fixed;left:40px;right:40px;top:32px;display:flex;align-items:center;justify-content:space-between;gap:24px;pointer-events:none}
    .brand{font-size:18px;font-weight:600;letter-spacing:-.6px}.brand span{font-weight:400;color:var(--muted)}
    .status{font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px;align-items:center}.status:before{content:'';width:4px;height:4px;border-radius:50%;background:#eaa16e}
    footer{position:fixed;bottom:30px;left:40px;right:40px;display:flex;align-items:end;justify-content:space-between;gap:20px}
    .hint{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 12px}
    .row{display:flex;gap:6px;flex-wrap:wrap}button{font:12px Arial,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;min-height:38px}
    button:hover,button[aria-pressed="true"]{border-color:#bd895f;background:#bd895f15}button:focus-visible{outline:2px solid #eaa16e;outline-offset:3px}
    .controls{display:flex;gap:8px}.note{position:fixed;left:40px;bottom:135px;font-size:12px;color:var(--muted);max-width:290px;line-height:1.65}
    @media(max-width:640px){header{left:20px;right:20px;top:24px}.status{font-size:9px;letter-spacing:.07em}footer{left:20px;right:20px;bottom:24px;align-items:start;flex-direction:column;gap:14px}.hint{max-width:260px}.note{left:20px;bottom:225px;max-width:220px}button{padding:9px 10px}}
  </style>
</head>

    getState(){return {width,height,dpr,time,paused,reduced,running:!!raf,assets:models.filter(m=>m.ready).length,views:models.filter(m=>m.turnReady).length,ambientAssets:ambientModels.filter(m=>m.ready).length,ambient:ambient?{kind:ambient.kind,age:ambient.age,duration:ambient.duration,pose:ambient.kind==='satellite'?satellitePose(ambient):null}:null,particles:dust.length,ship:lastModel,stars:stars.length,flight:ship?{...pose(ship),duration:ship.duration,velocity:ship.velocity}:null};},
    destroy(){stopped=true;cancelAnimationFrame(raf);observer.disconnect();intersection.disconnect();document.removeEventListener('visibilitychange',onVisibility);motionQuery.removeEventListener('change',onMotion);root.remove();delete window.CosmoBork;}
  };
  resize();synchronize();
})();

</script>
  <header><div class="brand">Cosmo<span>Bork</span></div><div class="status">Прозрачный слой</div></header>
  <p class="note">Цвет меняется под сценой.<br>У самих кораблей и анимации фона нет.</p>
  <footer>
    <div><p class="hint">Проверьте, как графика смотрится на вашем фоне.</p><div class="row" aria-label="Фон предпросмотра">
      <button data-bg="dark" aria-pressed="true">Графит</button><button data-bg="warm" aria-pressed="false">Тёплый</button><button data-bg="light" aria-pressed="false">Светлый</button><button data-bg="gradient" aria-pressed="false">Градиент</button><button data-bg="grid" aria-pressed="false">Сетка</button>
    </div></div>
    <div class="controls" style="flex-wrap:wrap"><button id="next">Другой корабль</button><button id="maneuver">Манёвр</button><button id="object">Спутник</button><button id="pause" aria-pressed="false">Пауза</button></div>
  </footer>
  <script>
    let index=0,paused=false;
    const api=()=>window.CosmoBork;
    let objectIndex=0;
    const objectKinds=['satellite','asteroid','comet'],objectLabels=['Спутник','Астероид','Комета'];
    document.querySelector('#object').onclick=e=>{api()?.previewAmbient(objectKinds[objectIndex]);objectIndex=(objectIndex+1)%3;e.target.textContent=objectLabels[objectIndex];};
    document.querySelectorAll('button[data-bg]').forEach(b=>b.onclick=()=>{document.body.dataset.bg=b.dataset.bg;document.querySelectorAll('button[data-bg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
    document.querySelector('#next').onclick=()=>{index=(index+1)%3;api()?.preview(index);};
    document.querySelector('#maneuver').onclick=()=>{api()?.previewManeuver(index);paused=false;const b=document.querySelector('#pause');b.textContent='Пауза';b.setAttribute('aria-pressed','false');};
    document.querySelector('#pause').onclick=e=>{paused=!paused;paused?api()?.pause():api()?.resume();e.target.textContent=paused?'Продолжить':'Пауза';e.target.setAttribute('aria-pressed',String(paused));};
    const wait=setInterval(()=>{if(api()?.getState().assets===3){clearInterval(wait);api().preview(0);if(api().getState().reduced){document.querySelector('.note').textContent='Включено уменьшение движения: показаны только неподвижные звёзды.';document.querySelector('#next').disabled=true;document.querySelector('#maneuver').disabled=true;document.querySelector('#pause').disabled=true;} }},100);setTimeout(()=>clearInterval(wait),15000);
  </script>
</body></html>
