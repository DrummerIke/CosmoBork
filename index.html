<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CosmoBork — предпросмотр</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
    body{--ink:#e2e5e9;--muted:#9098a5;--line:#ffffff18;background:#11151c;color:var(--ink);transition:background .4s}
    body[data-bg="warm"]{background:#292520}
    body[data-bg="light"]{background:#eae9e5;--ink:#242930;--muted:#60656c;--line:#00000020}
    body[data-bg="gradient"]{background:radial-gradient(ellipse at 15% 10%,#273746 0,transparent 62%),linear-gradient(130deg,#12191c,#251f2b)}
    body[data-bg="grid"]{background-color:#3b414b;background-image:linear-gradient(45deg,#ffffff0b 25%,transparent 25%),linear-gradient(-45deg,#ffffff0b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff0b 75%),linear-gradient(-45deg,transparent 75%,#ffffff0b 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    iframe{position:fixed;inset:0;border:0;width:100%;height:100%;background:transparent;pointer-events:none}
    header{position:fixed;left:40px;right:40px;top:32px;display:flex;align-items:center;justify-content:space-between;gap:24px;pointer-events:none}
    .brand{font-size:18px;font-weight:600;letter-spacing:-.6px}.brand span{font-weight:400;color:var(--muted)}
    .status{font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px;align-items:center}.status:before{content:'';width:4px;height:4px;border-radius:50%;background:#eaa16e}
    footer{position:fixed;bottom:30px;left:40px;right:40px;display:flex;align-items:end;justify-content:space-between;gap:20px}
    .hint{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 12px}
    .row{display:flex;gap:6px;flex-wrap:wrap}button{font:12px Arial,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;min-height:38px}
    button:hover,button[aria-pressed="true"]{border-color:#bd895f;background:#bd895f15}button:focus-visible{outline:2px solid #eaa16e;outline-offset:3px}
    .controls{display:flex;gap:8px}.note{position:fixed;left:40px;bottom:135px;font-size:12px;color:var(--muted);max-width:290px;line-height:1.65}
    @media(max-width:640px){header{left:20px;right:20px;top:24px}.status{font-size:9px;letter-spacing:.07em}footer{left:20px;right:20px;bottom:24px;align-items:start;flex-direction:column;gap:14px}.hint{max-width:260px}.note{left:20px;bottom:225px;max-width:220px}button{padding:9px 10px}}
  </style>
</head>

  const turnSurface = sprite(640,384,()=>{}), turnContext = turnSurface.getContext('2d',{alpha:true});
  const starColors = ['209,228,255','241,242,236','255,216,176'];
  const starHalos = starColors.map(glow);
  const starRays = sprite(96,96,g=>{
    // A small optical diffraction glint, cached once, with no opaque background.
    for(const [x,y,r,a] of [[44,.65,0,.8],[29,.6,Math.PI/2,.6],[12,.35,Math.PI/4,.2],[12,.35,-Math.PI/4,.2]]) {
      g.save();g.translate(48,48);g.rotate(r);
      const grad=g.createLinearGradient(-x,0,x,0);
      grad.addColorStop(0,'rgba(219,235,255,0)');grad.addColorStop(.5,`rgba(241,246,255,${a})`);grad.addColorStop(1,'rgba(219,235,255,0)');
      g.fillStyle=grad;g.beginPath();g.moveTo(-x,0);g.lineTo(0,-y);g.lineTo(x,0);g.lineTo(0,y);g.closePath();g.fill();g.restore();
    }
  });
  const clusters = [{x:.17,y:.27},{x:.74,y:.16},{x:.65,y:.76}];
  const starCatalog=Array.from({length:280},(_,i)=>{
    const layer=i%31===0?2:i%4===0?1:0;
    const group=clusters[i%clusters.length];
    const clustered=i%3===0;
    const nx=clustered?clamp(group.x+(Math.random()+Math.random()-1)*.2,.015,.985):Math.random();
    const ny=clustered?clamp(group.y+(Math.random()+Math.random()-1)*.21,.015,.985):Math.random();
    return {id:i,nx,ny,layer,color:i%7===0?2:i%3===0?1:0,
      r:layer===2?rand(.95,1.35):layer===1?rand(.65,.95):rand(.4,.7),
      alpha:layer===2?rand(.65,.86):layer===1?rand(.4,.68):rand(.2,.43),
      phase:rand(0,TAU),frequency:rand(.18,.38)};
  });
  const smooth=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
  const integratedSmooth=(t,start,duration)=>{
    const u=(t-start)/duration;
    if(u<=0)return 0;if(u>=1)return t-start-duration*.5;
    return duration*(u*u*u-.5*u*u*u*u);
  };
  const exhaust = sprite(320, 80, (g) => {
    // Pre-rendered plume: narrow white root, warm translucent taper. No per-frame blur.
    for (const [half, alpha] of [[25,.13],[12,.28],[4,.88]]) {
      const gradient = g.createLinearGradient(16,40,305,40);
      gradient.addColorStop(0,`rgba(255,244,226,${alpha})`);
      gradient.addColorStop(.12,`rgba(255,192,116,${alpha*.8})`);
      gradient.addColorStop(.43,`rgba(240,117,47,${alpha*.3})`);
      gradient.addColorStop(1,'rgba(240,117,47,0)');
      g.fillStyle = gradient; g.beginPath(); g.moveTo(10,40-half*.3);
      g.bezierCurveTo(60,40-half,180,40-half*.2,315,40);
      g.bezierCurveTo(180,40+half*.2,60,40+half,10,40+half*.3);
      g.closePath(); g.fill();
    }
  });
  function resize() {
    const previousWidth=width,previousHeight=height;
    const rect = root.getBoundingClientRect();
    width = Math.max(1, rect.width); height = Math.max(1, rect.height); mobile = width <= 640;
    dpr = Math.min(devicePixelRatio || 1, lowQuality() ? 1.25 : 1.75, Math.sqrt((lowQuality()?1500000:4000000)/(width*height)));
    canvas.width = Math.round(width*dpr); canvas.height = Math.round(height*dpr);
    stars=starCatalog.slice(0,Math.round(clamp(width*height/(lowQuality()?7200:5900),55,280)));
    if(width!==previousWidth||height!==previousHeight)for(const craft of [ship]) {
      if(!craft)continue;
      const oldDuration=craft.duration,progress=craft.age/oldDuration;
      craft.w=Math.min(width*.46,craft.model.width*(mobile?.73:1))*craft.depth;
      craft.h=craft.w*craft.model.image.naturalHeight/craft.model.image.naturalWidth;
      craft.velocity=([43,53,35][models.indexOf(craft.model)])*(mobile?.7:1)*craft.depth;
      craft.duration=(width+craft.w*1.8)/craft.velocity;
      const ratio=craft.duration/oldDuration;
      craft.age=progress*craft.duration;craft.maneuverStart*=ratio;craft.maneuverDuration*=ratio;craft.maneuverGap*=ratio;
      craft.y*=height/previousHeight;
    }
    draw();
  }
  function createShip(index = null, at = 0) {
    const ready = models.map((m,i)=>m.ready?i:-1).filter(i=>i>=0);
    if (!ready.length) return null;
    let mi = index === null ? ready[modelIndex++ % ready.length] : index;
    if (!models[mi]?.ready) mi = ready[0];
    lastModel = mi;
    const model = models[mi];
    // Different craft mass / flight distance. No scale pulsing or sinusoidal bobbing.
    const depth=rand(.87,1);
    const w = Math.min(width*.46, model.width*(mobile?.73:1))*depth;
    const direction = Math.random()<.5 ? -1 : 1;
    const velocity=([43,53,35][mi])*(mobile?.7:1)*depth;
    const duration=(width+w*1.8)/velocity;
    const slopeLimit=Math.min(.055,height*.12/(width+w*1.8));
    const initialSlope=rand(-slopeLimit*.45,slopeLimit*.45);
    const finalSlope=clamp(initialSlope+(Math.random()<.5?-1:1)*rand(slopeLimit*.6,slopeLimit*.95),-slopeLimit,slopeLimit);
    const craft = {model, direction, age:0, w, h:w*model.image.naturalHeight/model.image.naturalWidth,
      duration,velocity,initialSlope,finalSlope,depth,
      maneuverStart:duration*rand(.18,.23),maneuverDuration:rand(4.8,6),maneuverGap:rand(3.5,5),
      y: height*rand(.19,.34), phase:rand(0,TAU),angle:Math.atan(initialSlope)*direction,
      label:labels[labelIndex++%labels.length], dustAt:0};
    craft.age = craft.duration*clamp(at,0,1);
    craft.angle=attitude(craft);
    return craft;
  }
  function spawnShip(index = null, at = 0) {
    ship=createShip(index,at);
    if(!ship){nextShip=time+1;return;}
    nextShip = Infinity;
  }
  function course(s,lead=0) {
    const delta=s.finalSlope-s.initialSlope,period=s.maneuverDuration+s.maneuverGap;
    let slope=s.initialSlope,vertical=s.initialSlope*s.age;
    const count=Math.max(0,Math.floor((s.age+lead-s.maneuverStart)/period)+1);
    for(let i=0;i<count;i++) {
      const start=s.maneuverStart+i*period,sign=i%2?-1:1;
      slope+=sign*delta*smooth((s.age+lead-start)/s.maneuverDuration);
      vertical+=sign*delta*integratedSmooth(s.age,start,s.maneuverDuration);
    }
    return {slope,vertical};
  }
  function attitude(s) {
    return Math.atan(course(s,.65).slope)*s.direction;
  }
  function pose(s) {
    const p = clamp(s.age/s.duration,0,1);
    const distance = width+s.w*1.8;
    const x = s.direction===1 ? -s.w*.9+p*distance : width+s.w*.9-p*distance;
    const y = s.y+s.velocity*course(s).vertical;
    const elapsed=s.age-s.maneuverStart,period=s.maneuverDuration+s.maneuverGap;
    const cycle=Math.max(0,Math.floor(elapsed/period));
    const phase=(elapsed-cycle*period)/s.maneuverDuration;
    const burn=Math.sin(Math.PI*clamp(phase,0,1));
    const turn=!s.model.turnReady?0:smooth(phase/.38)*(1-smooth((phase-.62)/.38));
    const jet=(center)=>Math.exp(-Math.pow((phase-center)/.038,2));
    const jets=phase>0&&phase<1?[jet(.12)+jet(.22)*.7,jet(.78)*.7+jet(.88)]:[0,0];
    const h=s.model.turnReady?s.h+(s.w*s.model.turnImage.naturalHeight/s.model.turnImage.naturalWidth-s.h)*turn:s.h;
    const bank=burn*.024*s.direction*(cycle%2?-1:1);
    return {x,y,angle:s.angle+bank,p,burn,turn,jets,h,cycle};
  }
  function nozzles(s,p) {
    return s.model.nozzles.map((n,i)=>{
      const alt=s.model.turnNozzles?.[i]||n;
      return n.map((v,j)=>v+(alt[j]-v)*p.turn);
    });
  }
  function nozzlePoint(s, nozzle, p) {
    const flip = -s.direction, lx=(nozzle[0]-.5)*s.w*flip, ly=(nozzle[1]-.5)*p.h;
    return {x:p.x+lx*Math.cos(p.angle)-ly*Math.sin(p.angle),
      y:p.y+lx*Math.sin(p.angle)+ly*Math.cos(p.angle)};
  }
  function update(dt) {
    time += dt;
    if (!ship && time>=nextShip) spawnShip();
    if (ship) {
      ship.age += dt;
      const inertia=ship.model.name==='surveyor'?1.2:2;
      ship.angle+=(attitude(ship)-ship.angle)*(1-Math.exp(-dt*inertia));
      const p=pose(ship);
      if (time>=ship.dustAt && p.p>.08 && p.p<.92 && dust.length<24) {
        ship.dustAt=time+(lowQuality()?.22:.13);
        for (const n of nozzles(ship,p).slice(0,lowQuality()?1:2)) {
          if(dust.length>=24)break;
          const point=nozzlePoint(ship,n,p);
          dust.push({x:point.x,y:point.y,age:0,life:rand(.6,1.1),r:rand(.65,1.4),
            vx:-ship.direction*Math.cos(p.angle)*rand(14,24),vy:-ship.direction*Math.sin(p.angle)*20+rand(-.8,.8)});
        }
      }
      if (ship.age>=ship.duration) {ship=null;nextShip=time+rand(7,11);}
    }
    for (let i=dust.length-1;i>=0;i--) {const d=dust[i];d.age+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.age>d.life)dust.splice(i,1);}
    if (!meteor && time>=nextMeteor) {
      meteor={x:width*rand(.35,.85),y:height*rand(.04,.17),age:0,life:1.4,length:mobile?95:175};
      nextMeteor=time+rand(19,35);
    }
    if (meteor) {meteor.age+=dt;meteor.x-=dt*320;meteor.y+=dt*94;if(meteor.age>=meteor.life)meteor=null;}
    if(stellarFlare && time-stellarFlare.start>stellarFlare.duration)stellarFlare=null;
    if(!stellarFlare && time>=nextFlare) {
      const bright=stars.filter(s=>s.layer===2);
      if(bright.length)stellarFlare={id:bright[Math.floor(Math.random()*bright.length)].id,start:time,duration:rand(2.8,4.2)};
      nextFlare=time+rand(9,16);
    }
  }
  function drawStars() {
    for(const s of stars) {
      const clock=reduced?0:time,drift=[.045,.16,.36][s.layer];
      const x=((s.nx*width-clock*drift) % width+width)%width;
      const y=(s.ny*height+clock*drift*.13)%height;
      const edge=clamp(Math.min(x,width-x,y,height-y)/14,0,1);
      const twinkle=reduced||s.layer===0?1:1+Math.sin(clock*s.frequency+s.phase)*.08;
      const event=!reduced&&stellarFlare?.id===s.id?Math.pow(Math.sin(Math.PI*clamp((time-stellarFlare.start)/stellarFlare.duration,0,1)),2):0;
      ctx.globalAlpha=s.alpha*twinkle*edge;
      ctx.fillStyle=`rgb(${starColors[s.color]})`;
      // Snap the faintest points to pixels for a crisp, stable distant field.
      if(s.layer===0)ctx.fillRect(Math.round(x*dpr)/dpr,Math.round(y*dpr)/dpr,s.r,s.r);
      else {ctx.beginPath();ctx.arc(x,y,s.r*.65,0,TAU);ctx.fill();}
      if(s.layer>0) {
        const size=s.layer===2?22+event*12:10;
        ctx.globalAlpha=(s.layer===2?.55+event*.35:.18)*edge;
        ctx.drawImage(starHalos[s.color],x-size/2,y-size/2,size,size);
      }
      if(s.layer===2) {
        const raySize=17+event*25;
        ctx.globalAlpha=(.23+event*.65)*edge;
        ctx.drawImage(starRays,x-raySize/2,y-raySize/2,raySize,raySize);
      }
    }
    ctx.globalAlpha=1;
  }
  function drawShip(s) {
    const p=pose(s), flip=-s.direction,h=p.h;
    const alpha=Math.min(1,p.p*14,(1-p.p)*14)*(.86+s.depth*.14);
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.scale(flip,1);
    // Quiet cruise thrust rises gently for the one course correction.
    const pulse=.42+p.burn*.5+Math.sin(time*3.1+s.phase)*.018;
    const activeNozzles=nozzles(s,p);
    for(const n of activeNozzles) {
      const x=(n[0]-.5)*s.w,y=(n[1]-.5)*h;
      const length=s.w*.34*pulse, plumeHeight=s.w*(n[2]||.07);
      ctx.drawImage(exhaust,x-length*.03,y-plumeHeight/2,length,plumeHeight);
    }
    if(p.turn<.001)ctx.drawImage(s.model.image,-s.w/2,-h/2,s.w,h);
    else if(p.turn>.999)ctx.drawImage(s.model.turnImage,-s.w/2,-h/2,s.w,h);
    else {
      // Add weighted RGBA layers offscreen; avoids darkening the overlapping hull.
      const bw=Math.min(640,Math.ceil(s.w*dpr)),bh=Math.min(384,Math.ceil(h*dpr));
      turnContext.clearRect(0,0,640,384);turnContext.globalCompositeOperation='source-over';
      const a=s.model.profile,b=s.model.turnProfile;
      const warped=(img,profile)=>{
        if(!a||!b){turnContext.drawImage(img,0,0,bw,bh);return;}
        for(let i=0;i<a.length;i++) {
          const top=a[i][0]+(b[i][0]-a[i][0])*p.turn;
          const bottom=a[i][1]+(b[i][1]-a[i][1])*p.turn;
          const sx=i*img.naturalWidth/a.length,sw=img.naturalWidth/a.length;
          const sy=profile[i][0]*img.naturalHeight,sh=(profile[i][1]-profile[i][0])*img.naturalHeight;
          turnContext.drawImage(img,sx,sy,sw,sh,i*bw/a.length,top*bh,bw/a.length,(bottom-top)*bh);
        }
      };
      turnContext.globalAlpha=1-p.turn;warped(s.model.image,a);
      turnContext.globalCompositeOperation='lighter';turnContext.globalAlpha=p.turn;
      warped(s.model.turnImage,b);
      turnContext.globalAlpha=1;turnContext.globalCompositeOperation='source-over';
      ctx.drawImage(turnSurface,0,0,bw,bh,-s.w/2,-h/2,s.w,h);
    }
    for(const n of activeNozzles) {
      const x=(n[0]-.5)*s.w,y=(n[1]-.5)*h;
      const r=s.w*.055*pulse;
      ctx.globalAlpha=alpha*.66;ctx.drawImage(warmGlow,x-r/2,y-r/2,r,r);
      ctx.globalAlpha=alpha*.83;ctx.fillStyle='#fff0d9';
      ctx.beginPath();ctx.ellipse(x,y,Math.max(.45,s.w*.0024),Math.max(.8,s.w*.006),0,0,TAU);ctx.fill();
    }
    {
      const ports=s.model.ports||[[.32,.18],[.78,.18]];
      for(let i=0;i<2;i++) {
        const power=p.jets[i];if(power<.025)continue;
        const upper=(s.finalSlope>s.initialSlope)!==Boolean(p.cycle%2);
        const x=(ports[i][0]-.5)*s.w,y=((upper?ports[i][1]:1-ports[i][1])-.5)*h;
        ctx.save();ctx.translate(x,y);ctx.rotate(upper?-Math.PI/2:Math.PI/2);
        ctx.globalAlpha=alpha*power*.65;
        ctx.drawImage(coldGlow,-3,-4,12,8);
        ctx.globalAlpha=alpha*power*.28;
        ctx.drawImage(coldGlow,0,-3,16*power+5,6);
        ctx.globalAlpha=alpha*power*.9;ctx.fillStyle='#e4f0ff';ctx.fillRect(-.5,-.65,1.3,1.3);ctx.restore();
      }
    }
    ctx.restore();

    // Label lives in screen space; never mirrors or tilts with the craft.
    const ly=p.y+h*.5+Math.abs(Math.sin(p.angle))*s.w*.5+13;
    ctx.save();ctx.globalAlpha=alpha*.72;ctx.fillStyle='#ec9b5f';
    ctx.beginPath();ctx.arc(p.x-13,ly-3,1.3,0,TAU);ctx.fill();
    ctx.font='500 10px Arial, sans-serif';ctx.fillStyle='#c4c9d0';
    ctx.textBaseline='middle';ctx.fillText(s.label,p.x-7,ly-2.5);ctx.restore();
  }
  function draw() {
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawStars();
    if(!reduced) {

      for(const d of dust) {
        const fade=1-d.age/d.life;ctx.globalAlpha=.23*fade*fade;
        ctx.drawImage(warmGlow,d.x-d.r*3,d.y-d.r*3,d.r*6,d.r*6);
      }
      ctx.globalAlpha=1;
      if(ship)drawShip(ship);
      if(meteor) {
        const m=meteor,fade=Math.sin(Math.PI*m.age/m.life)*.5;
        ctx.save();ctx.translate(m.x,m.y);ctx.rotate(-.286);
        const gradient=ctx.createLinearGradient(0,0,m.length,0);
        gradient.addColorStop(0,`rgba(221,238,255,${fade})`);gradient.addColorStop(1,'rgba(221,238,255,0)');
        ctx.fillStyle=gradient;ctx.beginPath();ctx.moveTo(0,-.8);ctx.lineTo(m.length,0);ctx.lineTo(0,.8);ctx.fill();
        ctx.globalAlpha=fade*.6;ctx.drawImage(coldGlow,-6,-6,12,12);ctx.restore();
      }
    }
    ctx.globalAlpha=1;
  }
  function canRun(){return !stopped&&!paused&&!document.hidden&&visible&&!reduced;}
  function frame(now) {
    raf=0;if(!canRun())return;
    const interval=1000/(lowQuality()?30:45);
    if(now-renderAt>=interval-.5) {
      const dt=previous?Math.min(.1,(now-previous)/1000)*speed:0;
      previous=now;renderAt=now-((now-renderAt)%interval);update(dt);draw();
    }
    raf=requestAnimationFrame(frame);
  }
  function synchronize() {
    cancelAnimationFrame(raf);raf=0;previous=0;renderAt=0;
    if(canRun())raf=requestAnimationFrame(frame);else draw();
  }
  const onVisibility=()=>synchronize();
  const onMotion=e=>{reduced=e.matches;if(reduced){ship=null;dust=[];meteor=null;stellarFlare=null;nextShip=time+1;}synchronize();};
  document.addEventListener('visibilitychange',onVisibility);
  motionQuery.addEventListener('change',onMotion);
  const observer=new ResizeObserver(resize);observer.observe(root);
  const intersection=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;synchronize();});intersection.observe(root);
  models.forEach(m=>{
    m.image.decoding='async';
    m.image.onload=()=>{if(!stopped){m.ready=true;root.dataset.assets=String(models.filter(a=>a.ready).length);}};
    m.image.onerror=()=>{m.ready=false;root.dataset.assetError='true';};
    m.image.src=m.src;
    if(m.turnSrc) {
      m.turnImage.decoding='async';m.turnImage.onload=()=>{if(!stopped)m.turnReady=true;};
      m.turnImage.onerror=()=>{m.turnReady=false;root.dataset.assetError='true';};
      m.turnImage.src=m.turnSrc;
    }
  });
  window.CosmoBork={
    pause(){paused=true;synchronize();},resume(){paused=false;synchronize();},
    setSpeed(value){speed=clamp(Number(value)||1,.25,4);},
    setQuality(value){mode=['auto','eco','high'].includes(value)?value:'auto';resize();},
    preview(index=0){if(reduced)return;spawnShip(index,.46);dust=[];draw();},
    previewManeuver(index=lastModel<0?0:lastModel){if(reduced)return;spawnShip(index);if(ship){ship.age=Math.max(0,ship.maneuverStart-.5);ship.angle=attitude(ship);}dust=[];paused=false;synchronize();},
    getState(){return {width,height,dpr,time,paused,reduced,running:!!raf,assets:models.filter(m=>m.ready).length,views:models.filter(m=>m.turnReady).length,particles:dust.length,ship:lastModel,stars:stars.length,flight:ship?{...pose(ship),duration:ship.duration,velocity:ship.velocity}:null};},
    destroy(){stopped=true;cancelAnimationFrame(raf);observer.disconnect();intersection.disconnect();document.removeEventListener('visibilitychange',onVisibility);motionQuery.removeEventListener('change',onMotion);root.remove();delete window.CosmoBork;}
  };
  resize();synchronize();
})();

</script>
  <header><div class="brand">Cosmo<span>Bork</span></div><div class="status">Прозрачный слой</div></header>
  <p class="note">Цвет меняется под сценой.<br>У самих кораблей и анимации фона нет.</p>
  <footer>
    <div><p class="hint">Проверьте, как графика смотрится на вашем фоне.</p><div class="row" aria-label="Фон предпросмотра">
      <button data-bg="dark" aria-pressed="true">Графит</button><button data-bg="warm" aria-pressed="false">Тёплый</button><button data-bg="light" aria-pressed="false">Светлый</button><button data-bg="gradient" aria-pressed="false">Градиент</button><button data-bg="grid" aria-pressed="false">Сетка</button>
    </div></div>
    <div class="controls"><button id="next">Другой корабль</button><button id="maneuver">Манёвр</button><button id="pause" aria-pressed="false">Пауза</button></div>
  </footer>
  <script>
    let index=0,paused=false;
    const api=()=>window.CosmoBork;
    document.querySelectorAll('button[data-bg]').forEach(b=>b.onclick=()=>{document.body.dataset.bg=b.dataset.bg;document.querySelectorAll('button[data-bg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
    document.querySelector('#next').onclick=()=>{index=(index+1)%3;api()?.preview(index);};
    document.querySelector('#maneuver').onclick=()=>{api()?.previewManeuver(index);paused=false;const b=document.querySelector('#pause');b.textContent='Пауза';b.setAttribute('aria-pressed','false');};
    document.querySelector('#pause').onclick=e=>{paused=!paused;paused?api()?.pause():api()?.resume();e.target.textContent=paused?'Продолжить':'Пауза';e.target.setAttribute('aria-pressed',String(paused));};
    const wait=setInterval(()=>{if(api()?.getState().assets===3){clearInterval(wait);api().preview(0);if(api().getState().reduced){document.querySelector('.note').textContent='Включено уменьшение движения: показаны только неподвижные звёзды.';document.querySelector('#next').disabled=true;document.querySelector('#maneuver').disabled=true;document.querySelector('#pause').disabled=true;} }},100);setTimeout(()=>clearInterval(wait),15000);
  </script>
</body></html>
