        ctx.globalAlpha=(s.layer===2?.55+event*.35:.18)*edge;
        ctx.drawImage(starHalos[s.color],x-size/2,y-size/2,size,size);
      }
      if(s.layer===2) {
        const raySize=17+event*25;
        ctx.globalAlpha=(.23+event*.65)*edge;
        ctx.drawImage(starRays,x-raySize/2,y-raySize/2,raySize,raySize);
      }
    }
    ctx.globalAlpha=1;
  }
  function drawShip(s) {
    const p=pose(s), flip=-s.direction,h=p.h;
    const alpha=Math.min(1,p.p*14,(1-p.p)*14)*(.86+s.depth*.14);
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.scale(flip,1);
    // Quiet cruise thrust rises gently for the one course correction.
    const pulse=.62+p.burn*.43+Math.sin(time*3.1+s.phase)*.018;
    const activeNozzles=nozzles(s,p);
    for(const n of activeNozzles) {
      const x=(n[0]-.5)*s.w,y=(n[1]-.5)*h;
      const length=s.w*.34*pulse, plumeHeight=s.w*(n[2]||.07);
      ctx.drawImage(exhaust,x-length*.03,y-plumeHeight/2,length,plumeHeight);
    }
    if(p.turn<.001)ctx.drawImage(s.model.image,-s.w/2,-h/2,s.w,h);
    else if(p.turn>.999)ctx.drawImage(s.model.turnImage,-s.w/2,-h/2,s.w,h);
    else {
      // Add weighted RGBA layers offscreen; avoids darkening the overlapping hull.
      const bw=Math.min(640,Math.ceil(s.w*dpr)),bh=Math.min(384,Math.ceil(h*dpr));
      turnContext.clearRect(0,0,640,384);turnContext.globalCompositeOperation='source-over';
      const a=s.model.profile,b=s.model.turnProfile;
      const warped=(img,profile)=>{
        if(!a||!b){turnContext.drawImage(img,0,0,bw,bh);return;}
        for(let i=0;i<a.length;i++) {
          const top=a[i][0]+(b[i][0]-a[i][0])*p.turn;
          const bottom=a[i][1]+(b[i][1]-a[i][1])*p.turn;
          const sx=i*img.naturalWidth/a.length,sw=img.naturalWidth/a.length;
          const sy=profile[i][0]*img.naturalHeight,sh=(profile[i][1]-profile[i][0])*img.naturalHeight;
          turnContext.drawImage(img,sx,sy,sw,sh,i*bw/a.length,top*bh,bw/a.length,(bottom-top)*bh);
        }
      };
      turnContext.globalAlpha=1-p.turn;warped(s.model.image,a);
      turnContext.globalCompositeOperation='lighter';turnContext.globalAlpha=p.turn;
      warped(s.model.turnImage,b);
      turnContext.globalAlpha=1;turnContext.globalCompositeOperation='source-over';
      ctx.drawImage(turnSurface,0,0,bw,bh,-s.w/2,-h/2,s.w,h);
    }
    for(const n of activeNozzles) {
      const x=(n[0]-.5)*s.w,y=(n[1]-.5)*h;
      const r=s.w*.055*pulse;
      ctx.globalAlpha=alpha*.66;ctx.drawImage(warmGlow,x-r/2,y-r/2,r,r);
      ctx.globalAlpha=alpha*.83;ctx.fillStyle='#fff0d9';
      ctx.beginPath();ctx.ellipse(x,y,Math.max(.45,s.w*.0024),Math.max(.8,s.w*.006),0,0,TAU);ctx.fill();
    }
    {
      const ports=s.model.ports||[[.32,.18],[.78,.18]];
      for(let i=0;i<2;i++) {
        const power=p.jets[i];if(power<.025)continue;
        const upper=s.finalSlope>s.initialSlope;
        const x=(ports[i][0]-.5)*s.w,y=((upper?ports[i][1]:1-ports[i][1])-.5)*h;
        ctx.save();ctx.translate(x,y);ctx.rotate(upper?-Math.PI/2:Math.PI/2);
        ctx.globalAlpha=alpha*power*.65;
        ctx.drawImage(coldGlow,-3,-4,12,8);
        ctx.globalAlpha=alpha*power*.28;
        ctx.drawImage(coldGlow,0,-3,16*power+5,6);
        ctx.globalAlpha=alpha*power*.9;ctx.fillStyle='#e4f0ff';ctx.fillRect(-.5,-.65,1.3,1.3);ctx.restore();
      }
    }
    ctx.restore();

    // Label lives in screen space; never mirrors or tilts with the craft.
    const ly=p.y+h*.5+Math.abs(Math.sin(p.angle))*s.w*.5+13;
    ctx.save();ctx.globalAlpha=alpha*.72;ctx.fillStyle='#ec9b5f';
    ctx.beginPath();ctx.arc(p.x-13,ly-3,1.3,0,TAU);ctx.fill();
    ctx.font='500 10px Arial, sans-serif';ctx.fillStyle='#c4c9d0';
    ctx.textBaseline='middle';ctx.fillText(s.label,p.x-7,ly-2.5);ctx.restore();
  }
  function draw() {
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawStars();
    if(!reduced) {

      for(const d of dust) {
        const fade=1-d.age/d.life;ctx.globalAlpha=.23*fade*fade;
        ctx.drawImage(warmGlow,d.x-d.r*3,d.y-d.r*3,d.r*6,d.r*6);
      }
      ctx.globalAlpha=1;
      if(ship)drawShip(ship);
      if(meteor) {
        const m=meteor,fade=Math.sin(Math.PI*m.age/m.life)*.5;
        ctx.save();ctx.translate(m.x,m.y);ctx.rotate(-.286);
        const gradient=ctx.createLinearGradient(0,0,m.length,0);
        gradient.addColorStop(0,`rgba(221,238,255,${fade})`);gradient.addColorStop(1,'rgba(221,238,255,0)');
        ctx.fillStyle=gradient;ctx.beginPath();ctx.moveTo(0,-.8);ctx.lineTo(m.length,0);ctx.lineTo(0,.8);ctx.fill();
        ctx.globalAlpha=fade*.6;ctx.drawImage(coldGlow,-6,-6,12,12);ctx.restore();
      }
    }
    ctx.globalAlpha=1;
  }
  function canRun(){return !stopped&&!paused&&!document.hidden&&visible&&!reduced;}
  function frame(now) {
    raf=0;if(!canRun())return;
    const interval=1000/(lowQuality()?30:45);
    if(now-renderAt>=interval-.5) {
      const dt=previous?Math.min(.1,(now-previous)/1000)*speed:0;
      previous=now;renderAt=now-((now-renderAt)%interval);update(dt);draw();
    }
    raf=requestAnimationFrame(frame);
  }
  function synchronize() {
    cancelAnimationFrame(raf);raf=0;previous=0;renderAt=0;
    if(canRun())raf=requestAnimationFrame(frame);else draw();
  }
  const onVisibility=()=>synchronize();
  const onMotion=e=>{reduced=e.matches;if(reduced){ship=null;dust=[];meteor=null;stellarFlare=null;nextShip=time+1;}synchronize();};
  document.addEventListener('visibilitychange',onVisibility);
  motionQuery.addEventListener('change',onMotion);
  const observer=new ResizeObserver(resize);observer.observe(root);
  const intersection=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;synchronize();});intersection.observe(root);
  models.forEach(m=>{
    m.image.decoding='async';
    m.image.onload=()=>{if(!stopped){m.ready=true;root.dataset.assets=String(models.filter(a=>a.ready).length);}};
    m.image.onerror=()=>{m.ready=false;root.dataset.assetError='true';};
    m.image.src=m.src;
    if(m.turnSrc) {
      m.turnImage.decoding='async';m.turnImage.onload=()=>{if(!stopped)m.turnReady=true;};
      m.turnImage.onerror=()=>{m.turnReady=false;root.dataset.assetError='true';};
      m.turnImage.src=m.turnSrc;
    }
  });
  window.CosmoBork={
    pause(){paused=true;synchronize();},resume(){paused=false;synchronize();},
    setSpeed(value){speed=clamp(Number(value)||1,.25,4);},
    setQuality(value){mode=['auto','eco','high'].includes(value)?value:'auto';resize();},
    preview(index=0){if(reduced)return;spawnShip(index,.46);dust=[];draw();},
    previewManeuver(index=lastModel<0?0:lastModel){if(reduced)return;spawnShip(index);if(ship){ship.age=Math.max(0,ship.maneuverStart-.5);ship.angle=attitude(ship);}dust=[];paused=false;synchronize();},
    getState(){return {width,height,dpr,time,paused,reduced,running:!!raf,assets:models.filter(m=>m.ready).length,views:models.filter(m=>m.turnReady).length,particles:dust.length,ship:lastModel,stars:stars.length,flight:ship?{...pose(ship),duration:ship.duration,velocity:ship.velocity}:null};},
    destroy(){stopped=true;cancelAnimationFrame(raf);observer.disconnect();intersection.disconnect();document.removeEventListener('visibilitychange',onVisibility);motionQuery.removeEventListener('change',onMotion);root.remove();delete window.CosmoBork;}
  };
  resize();synchronize();
})();

</script></body></html>
